<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="description" content="Driver's Diary By Head Green!" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Driver's Diary" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <title>Driver's Diary</title>
    <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}</script>
    <!--
      The one and only preloader. It lives here, not in React, so it is in the very first paint.
      It opens on the same background and centred logo as Android's launch screen (see the manifest
      in vite.config.js), then settles once. Nothing loops unless loading is genuinely slow.
    -->
    <style id="preloader-css">
      html { background: #0f1117; }
      #preloader {
        --s: min(46vw, 180px);
        --settled: .72;
        --lift: 6vh;
        position: fixed; inset: 0; z-index: 10000; overflow: hidden; contain: strict;
        background: #0f1117; color: #f1f5f9;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .22s ease .14s;
      }
      /* Logo out first, then the background, so it never shows double over the app beneath. */
      .pl-content { position: absolute; inset: 0; transition: opacity .14s ease; }
      #preloader.pl-exit { opacity: 0; pointer-events: none; }
      #preloader.pl-exit .pl-content { opacity: 0; }
      /* A soft, static halo: it fades in once with the logo and moves with it, never pulses. */
      .pl-glow {
        position: absolute; left: 50%; top: 50%;
        width: calc(var(--s) * 2.4); height: calc(var(--s) * 2.4);
        margin: calc(var(--s) * -1.2) 0 0 calc(var(--s) * -1.2);
        border-radius: 50%; opacity: 0;
        /* Layered bloom: a bright core hugging the tile, a wide emerald haze, and a faint cool edge for depth. */
        background:
          radial-gradient(closest-side, rgba(110, 231, 183, .5), rgba(52, 211, 153, .3) 30%, rgba(16, 185, 129, .14) 52%, rgba(16, 185, 129, .05) 70%, transparent),
          radial-gradient(closest-side at 50% 58%, rgba(56, 189, 248, .1), transparent 85%);
        animation: pl-settle .7s .08s cubic-bezier(.22, 1, .36, 1) forwards, pl-fade 1.1s .12s ease-out forwards;
      }
      .pl-logo {
        position: absolute; left: 50%; top: 50%;
        display: block; width: var(--s); height: var(--s);
        margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
        border-radius: 22%;
        box-shadow: 0 0 0 1px rgba(110, 231, 183, .28), 0 0 28px rgba(16, 185, 129, .4), 0 16px 44px rgba(0, 0, 0, .5);
        animation: pl-settle .7s .08s cubic-bezier(.22, 1, .36, 1) forwards;
      }
      .pl-name {
        position: absolute; left: 0; right: 0; margin: 0;
        top: calc(50% - var(--lift) + var(--s) * var(--settled) / 2 + 20px);
        text-align: center; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em;
        opacity: 0; animation: pl-rise .5s .22s cubic-bezier(.22, 1, .36, 1) forwards;
      }
      /* Appears only when a launch is slow, so a normal launch stays perfectly still. */
      .pl-wait {
        position: absolute; left: 50%; width: 88px; height: 2px; margin-left: -44px; overflow: hidden;
        top: calc(50% - var(--lift) + var(--s) * var(--settled) / 2 + 72px);
        border-radius: 2px; background: rgba(255, 255, 255, .1);
        opacity: 0; animation: pl-fade .3s 1.6s forwards;
      }
      .pl-wait::after {
        content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 2px; background: #10b981;
        animation: pl-travel 1.2s cubic-bezier(.45, 0, .55, 1) infinite;
      }
      .pl-from {
        position: absolute; left: 0; right: 0; margin: 0;
        bottom: calc(2rem + env(safe-area-inset-bottom));
        text-align: center; font-size: .8rem; font-weight: 500; color: #94a3b8;
        opacity: 0; animation: pl-fade .5s .4s ease-out forwards;
      }
      .pl-from b { color: #f1f5f9; font-weight: 700; }
      .pl-fast .pl-logo, .pl-fast .pl-glow { animation: none; transform: translateY(calc(var(--lift) * -1)) scale(var(--settled)); }
      .pl-fast .pl-glow { opacity: 1; }
      .pl-fast .pl-name, .pl-fast .pl-from { animation: none; opacity: 1; }
      @keyframes pl-settle { to { transform: translateY(calc(var(--lift) * -1)) scale(var(--settled)); } }
      @keyframes pl-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes pl-fade { to { opacity: 1; } }
      @keyframes pl-travel { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .pl-glow, .pl-logo, .pl-name, .pl-from { animation-duration: .01ms !important; animation-delay: 0s !important; }
        .pl-wait::after { animation: none; width: 100%; }
        #preloader, .pl-content { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading Driver's Diary">
      <div class="pl-content">
        <div class="pl-glow" aria-hidden="true"></div>
        <img class="pl-logo" src="/src/assets/preloader-logo.webp" width="288" height="288" alt="" decoding="sync" />
        <p class="pl-name" aria-hidden="true">Driver's Diary</p>
        <div class="pl-wait" aria-hidden="true"></div>
        <p class="pl-from" aria-hidden="true">from <b>HeadGreen!™</b></p>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('preloader');
        var seen = false;
        try { seen = !!sessionStorage.getItem('hg-splash-shown'); } catch (e) {}
        // Full show once per session; a reload or service-worker update skips straight to the settled logo.
        if (seen) root.classList.add('pl-fast');
        var minimumMs = seen || matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1000;
        var hiding = false;
        window.__hidePreloader = function () {
          if (hiding) return;
          hiding = true;
          try { sessionStorage.setItem('hg-splash-shown', 'true'); } catch (e) {}
          setTimeout(function () {
            root.classList.add('pl-exit');
            setTimeout(function () {
              root.remove();
              document.getElementById('preloader-css').remove();
              delete window.__hidePreloader;
            }, 380);
          }, Math.max(0, minimumMs - performance.now()));
        };
        // Never trap anyone behind the preloader if the app fails to start.
        setTimeout(window.__hidePreloader, 10000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
